<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>ほしかけサバイバー</title>
<style>
  :root { --line:#f2eefa; --accent:#ffd34d; --panel:rgba(24,20,38,.92); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#0d0b14; color:var(--line); overflow:hidden; touch-action:none;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif; user-select:none; -webkit-user-select:none; }
  canvas { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; top:0; left:0; right:0; padding:10px 16px; pointer-events:none; }
  #xpbar { height:10px; background:#2a2440; border:2px solid var(--line); border-radius:6px; overflow:hidden; }
  #xpbar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#5aa8ff,#a07bff); transition:width .15s; }
  #row { display:flex; justify-content:space-between; margin-top:6px; font-size:15px; font-weight:bold; text-shadow:0 2px 0 #000; }
  #time { color:var(--accent); font-size:20px; }
  .overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(5,3,12,.7); padding:16px; }
  .card { background:var(--panel); border:3px solid var(--line); border-radius:14px; padding:20px; width:100%; max-width:420px; text-align:center; }
  .card h2 { margin:0 0 6px; color:var(--accent); letter-spacing:.08em; }
  .card p { margin:6px 0 14px; line-height:1.6; font-size:14px; opacity:.9; }
  .choice { display:flex; gap:12px; align-items:center; text-align:left; width:100%; margin:8px 0; padding:12px; font:inherit; color:var(--line);
    background:#2a2440; border:2px solid #6a5f8f; border-radius:10px; cursor:pointer; }
  .choice:hover, .choice.sel { border-color:var(--accent); background:#3a3358; }
  .choice .ic { font-size:30px; width:40px; text-align:center; }
  .choice b { color:var(--accent); } .choice small { display:block; opacity:.8; margin-top:2px; }
  .btn { font:inherit; font-weight:bold; font-size:17px; padding:12px 30px; border-radius:10px; border:3px solid var(--line); background:#3a3358; color:var(--accent); cursor:pointer; }
  #joy { position:fixed; width:120px; height:120px; border-radius:50%; border:3px solid rgba(255,255,255,.35); display:none; pointer-events:none; transform:translate(-50%,-50%); }
  #joy i { position:absolute; left:50%; top:50%; width:50px; height:50px; margin:-25px 0 0 -25px; border-radius:50%; background:rgba(255,255,255,.4); }
  #pausebtn { position:fixed; right:16px; top:52px; font-size:14px; padding:6px 12px; border-radius:8px; border:2px solid var(--line); background:var(--panel); color:var(--line); }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="xpbar"><i id="xp"></i></div>
  <div id="row"><span id="lv">Lv 1</span><span id="time">0:00</span><span id="kills">💀 0</span></div>
</div>
<button id="pausebtn">II</button>
<div id="joy"><i></i></div>

<div class="overlay" id="title" style="display:flex">
  <div class="card">
    <h2>★ ほしかけサバイバー ★</h2>
    <p>夜空の星を うばった〈やみのまどうし〉の 手下が おしよせてくる！<br>
       移動するだけで 星のちからが 自動で こうげき。<br>レベルアップで 新しい わざを えらぼう。<br>
       <b style="color:#ffd34d">5:00 に あらわれる ボスを たおせば クリア！</b></p>
    <p style="font-size:12px">PC：矢印キー / WASD 　スマホ：画面をドラッグ</p>
    <button class="btn" id="startBtn">はじめる</button>
  </div>
</div>
<div class="overlay" id="levelup"><div class="card"><h2>レベルアップ！</h2><p>ひとつ えらんでね（1〜3キーでも OK）</p><div id="choices"></div></div></div>
<div class="overlay" id="pause"><div class="card"><h2>ポーズ中</h2><p id="pauseInfo"></p><button class="btn" id="resumeBtn">つづける</button></div></div>
<div class="overlay" id="end"><div class="card"><h2 id="endTitle"></h2><p id="endText"></p><button class="btn" id="retryBtn">もういちど</button></div></div>

<script>
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
let VW, VH, DPR;
function resize() { DPR = Math.min(2, devicePixelRatio || 1); VW = innerWidth; VH = innerHeight; cv.width = VW*DPR; cv.height = VH*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener("resize", resize); resize();

// ===== わざ（武器）の定義 =====
const WEAPONS = {
  bolt:  { icon:"⭐", name:"ほしだま",     max:6, desc:l => l===1 ? "近くの敵に 星を 自動で うつ" : `うつ数 +1・威力アップ` },
  orbit: { icon:"🌙", name:"つきのわ",     max:6, desc:l => l===1 ? "まわりを 月が くるくる まわる" : `月の数 +1・威力アップ` },
  zap:   { icon:"⚡", name:"いなずま",     max:6, desc:l => l===1 ? "ランダムな敵に かみなりが おちる" : `回数 +1・威力アップ` },
  aura:  { icon:"🔆", name:"ひかりのわ",   max:6, desc:l => l===1 ? "まわりの敵に じわじわ ダメージ" : `範囲と威力アップ` },
  nova:  { icon:"💫", name:"ながれぼし",   max:6, desc:l => l===1 ? "8方向に 星が とびちる" : `威力アップ・間隔みじかく` },
};
const PASSIVES = {
  hp:    { icon:"❤️", name:"いのちのたね", max:5, desc:()=>"さいだいHP +20・HP回復" },
  speed: { icon:"👟", name:"かぜのくつ",   max:5, desc:()=>"いどう速度 +10%" },
  power: { icon:"💪", name:"ちからのゆびわ", max:5, desc:()=>"すべての威力 +15%" },
  cool:  { icon:"⏳", name:"すなどけい",   max:5, desc:()=>"わざの間隔 -8%" },
  magnet:{ icon:"🧲", name:"ほしのじしゃく", max:5, desc:()=>"けいけんちを ひきよせる範囲 +40%" },
};

const ENEMY_TYPES = [
  { e:"🫧", hp:6,  spd:55, dmg:6,  xp:1, r:13, t:0 },
  { e:"🦇", hp:5,  spd:95, dmg:5,  xp:1, r:12, t:20 },
  { e:"🐇", hp:14, spd:70, dmg:8,  xp:2, r:14, t:60 },
  { e:"🍄", hp:28, spd:50, dmg:10, xp:3, r:15, t:110 },
  { e:"🐺", hp:34, spd:90, dmg:12, xp:4, r:16, t:160 },
  { e:"🗿", hp:90, spd:38, dmg:18, xp:8, r:20, t:210 },
];
const BOSS_TIME = 300;

let G; // ゲーム状態
function newGame() {
  G = {
    t:0, kills:0, running:true, paused:false, bossSpawned:false, over:false,
    p:{ x:0, y:0, r:14, hp:100, maxhp:100, spd:150, inv:0, face:1, lv:1, xp:0, next:5 },
    weapons:{ bolt:1 }, passives:{}, cd:{},
    enemies:[], shots:[], gems:[], fx:[], texts:[], spawnAcc:0,
  };
  updateHud();
}
const mult = { pow:() => 1 + 0.15*(G.passives.power||0), cool:() => 1 - 0.08*(G.passives.cool||0),
               spd:() => 1 + 0.10*(G.passives.speed||0), mag:() => 70 * (1 + 0.4*(G.passives.magnet||0)) };

// ===== 入力 =====
const keys = {};
addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if ($("levelup").style.display === "flex" && "123".includes(e.key)) { const b = document.querySelectorAll(".choice")[+e.key-1]; if (b) b.click(); }
  if (e.key === "Escape" || e.key === "p") togglePause();
  if (e.key === "Enter") { for (const id of ["startBtn","retryBtn","resumeBtn"]) { const b=$(id); if (b.offsetParent) { b.click(); break; } } }
});
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
let joy = null;
cv.addEventListener("pointerdown", e => { joy = { sx:e.clientX, sy:e.clientY, dx:0, dy:0, id:e.pointerId }; const j=$("joy"); j.style.display="block"; j.style.left=e.clientX+"px"; j.style.top=e.clientY+"px"; j.firstElementChild.style.transform=""; });
addEventListener("pointermove", e => { if (!joy || e.pointerId !== joy.id) return;
  let dx = e.clientX-joy.sx, dy = e.clientY-joy.sy; const d = Math.hypot(dx,dy), m = 45; if (d > m) { dx*=m/d; dy*=m/d; }
  joy.dx = dx/m; joy.dy = dy/m; $("joy").firstElementChild.style.transform = `translate(${dx}px,${dy}px)`; });
const endJoy = e => { if (joy && e.pointerId === joy.id) { joy = null; $("joy").style.display = "none"; } };
addEventListener("pointerup", endJoy); addEventListener("pointercancel", endJoy);

function inputDir() {
  let x = 0, y = 0;
  if (keys["arrowleft"]||keys["a"]) x--; if (keys["arrowright"]||keys["d"]) x++;
  if (keys["arrowup"]||keys["w"]) y--;   if (keys["arrowdown"]||keys["s"]) y++;
  if (joy) { x += joy.dx; y += joy.dy; }
  const l = Math.hypot(x,y); return l > 1 ? [x/l, y/l] : [x, y];
}

// ===== 生成 =====
function spawnEnemy(type, boss) {
  const a = Math.random()*Math.PI*2, d = Math.hypot(VW,VH)/2 + 40;
  const scale = 1 + G.t/150; // 時間とともに強く
  const e = boss
    ? { e:"🧙", x:G.p.x+Math.cos(a)*d, y:G.p.y+Math.sin(a)*d, hp:3000, maxhp:3000, spd:62, dmg:25, xp:0, r:34, boss:true, hit:0, shootCd:2 }
    : { ...type, x:G.p.x+Math.cos(a)*d, y:G.p.y+Math.sin(a)*d, hp:type.hp*scale, maxhp:type.hp*scale, hit:0 };
  G.enemies.push(e);
}
function nearest(x, y, exclude) {
  let best = null, bd = Infinity;
  for (const e of G.enemies) { if (exclude && exclude.has(e)) continue; const d = (e.x-x)**2+(e.y-y)**2; if (d < bd) { bd = d; best = e; } }
  return best;
}
function hurt(e, n) {
  if (e.dead) return;
  e.hp -= n; e.hit = 0.1;
  G.texts.push({ x:e.x+(Math.random()*10-5), y:e.y-e.r, s:Math.round(n), life:0.6 });
  if (e.hp <= 0) {
    e.dead = true; G.kills++;
    if (e.boss) return victory();
    G.gems.push({ x:e.x, y:e.y, v:e.xp });
    if (Math.random() < 0.012) G.gems.push({ x:e.x+10, y:e.y, heal:true });
    for (let i=0;i<6;i++) G.fx.push({ x:e.x, y:e.y, vx:(Math.random()-.5)*200, vy:(Math.random()-.5)*200, life:.4, c:"#ffd34d" });
  }
}

// ===== わざの発動 =====
function fireWeapons(dt) {
  const W = G.weapons, p = G.p, pow = mult.pow(), cool = mult.cool();
  const ready = (k, base) => { G.cd[k] = (G.cd[k] ?? 0) - dt; if (G.cd[k] <= 0) { G.cd[k] = base*cool; return true; } return false; };

  if (W.bolt && ready("bolt", 0.9)) {
    const used = new Set();
    for (let i=0;i<W.bolt;i++) {
      const t = nearest(p.x, p.y, used) || nearest(p.x, p.y); if (!t) break; used.add(t);
      const a = Math.atan2(t.y-p.y, t.x-p.x);
      G.shots.push({ kind:"bolt", x:p.x, y:p.y, vx:Math.cos(a)*420, vy:Math.sin(a)*420, r:7, dmg:(8+W.bolt*3)*pow, life:1.4, pierce:1 });
    }
  }
  if (W.nova && ready("nova", 2.6 - W.nova*0.2)) {
    for (let i=0;i<8;i++) { const a = i*Math.PI/4 + G.t;
      G.shots.push({ kind:"nova", x:p.x, y:p.y, vx:Math.cos(a)*300, vy:Math.sin(a)*300, r:8, dmg:(10+W.nova*4)*pow, life:1, pierce:3 }); }
  }
  if (W.zap && ready("zap", 1.8)) {
    const onScreen = G.enemies.filter(e => Math.abs(e.x-p.x) < VW/2 && Math.abs(e.y-p.y) < VH/2);
    for (let i=0;i<W.zap && onScreen.length;i++) {
      const t = onScreen.splice(Math.random()*onScreen.length|0, 1)[0];
      G.fx.push({ zap:true, x:t.x, y:t.y, life:.25 });
      for (const e of G.enemies) if ((e.x-t.x)**2+(e.y-t.y)**2 < 50**2) hurt(e, (18+W.zap*6)*pow);
    }
  }
  if (W.orbit) {
    const n = W.orbit + 1, R = 70 + W.orbit*4, dmg = (6+W.orbit*3)*pow;
    for (let i=0;i<n;i++) {
      const a = G.t*3.2 + i*Math.PI*2/n, ox = p.x+Math.cos(a)*R, oy = p.y+Math.sin(a)*R;
      for (const e of G.enemies) if ((e.x-ox)**2+(e.y-oy)**2 < (e.r+12)**2 && !(e.orbitHit > 0)) { hurt(e, dmg); e.orbitHit = 0.4; }
    }
  }
  if (W.aura && ready("aura", 0.5)) {
    const R = 60 + W.aura*12;
    for (const e of G.enemies) if ((e.x-p.x)**2+(e.y-p.y)**2 < (R+e.r)**2) hurt(e, (3+W.aura*2)*pow);
  }
}

// ===== 更新 =====
function update(dt) {
  G.t += dt;
  const p = G.p, [ix, iy] = inputDir();
  const sp = p.spd * mult.spd();
  p.x += ix*sp*dt; p.y += iy*sp*dt; if (ix) p.face = Math.sign(ix);
  p.moving = ix || iy; p.inv -= dt;

  // 敵の出現
  if (!G.bossSpawned && G.t >= BOSS_TIME) { G.bossSpawned = true; spawnEnemy(null, true); banner("やみのまどうし が あらわれた！"); }
  const rate = G.bossSpawned ? 1.2 : 1.6 + G.t/14;
  G.spawnAcc += rate*dt;
  const pool = ENEMY_TYPES.filter(t => G.t >= t.t);
  while (G.spawnAcc >= 1 && G.enemies.length < 260) { G.spawnAcc--; spawnEnemy(pool[Math.random()*pool.length|0]); }
  if (G.t % 60 < dt && G.t > 1 && !G.bossSpawned) { for (let i=0;i<20;i++) spawnEnemy(pool[Math.random()*pool.length|0]); banner("むれが おしよせてきた！"); }

  fireWeapons(dt);

  // 敵の移動と接触
  for (const e of G.enemies) {
    const dx = p.x-e.x, dy = p.y-e.y, d = Math.hypot(dx,dy) || 1;
    e.x += dx/d*e.spd*dt; e.y += dy/d*e.spd*dt; e.hit -= dt; e.orbitHit -= dt;
    if (d > Math.hypot(VW,VH)) { const a = Math.random()*Math.PI*2, r = Math.hypot(VW,VH)/2+40; e.x = p.x+Math.cos(a)*r; e.y = p.y+Math.sin(a)*r; }
    if (d < e.r + p.r && p.inv <= 0) { p.hp -= e.dmg; p.inv = 0.5; shake = 0.2; if (p.hp <= 0) return gameOver(); }
    if (e.boss) { e.shootCd -= dt; if (e.shootCd <= 0) { e.shootCd = 1.6;
      for (let i=0;i<12;i++) { const a = i*Math.PI/6 + G.t; G.shots.push({ enemy:true, x:e.x, y:e.y, vx:Math.cos(a)*170, vy:Math.sin(a)*170, r:8, dmg:14, life:4 }); } } }
  }
  // 敵どうしの押し合い（簡易）
  for (let i=0;i<G.enemies.length;i+=2) { const a = G.enemies[i], b = G.enemies[i+1]; if (!b) break;
    const dx = a.x-b.x, dy = a.y-b.y, d = Math.hypot(dx,dy), m = a.r+b.r; if (d > 0 && d < m) { const k = (m-d)/2/d; a.x+=dx*k; a.y+=dy*k; b.x-=dx*k; b.y-=dy*k; } }

  // 弾
  for (const s of G.shots) {
    s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt;
    if (s.enemy) { if ((s.x-p.x)**2+(s.y-p.y)**2 < (s.r+p.r)**2 && p.inv <= 0) { p.hp -= s.dmg; p.inv = 0.5; s.life = 0; shake = .2; if (p.hp <= 0) return gameOver(); } continue; }
    for (const e of G.enemies) {
      if (e.dead || (s.hitSet && s.hitSet.has(e))) continue;
      if ((s.x-e.x)**2+(s.y-e.y)**2 < (s.r+e.r)**2) { hurt(e, s.dmg); (s.hitSet ||= new Set()).add(e); if (--s.pierce <= 0) { s.life = 0; break; } }
    }
  }
  G.shots = G.shots.filter(s => s.life > 0);
  G.enemies = G.enemies.filter(e => !e.dead);
  if (G.over) return;

  // けいけんち
  const mag = mult.mag();
  for (const g of G.gems) {
    const dx = p.x-g.x, dy = p.y-g.y, d = Math.hypot(dx,dy);
    if (d < mag || g.pull) { g.pull = true; g.x += dx/d*420*dt; g.y += dy/d*420*dt; }
    if (d < p.r+6) { g.got = true;
      if (g.heal) { p.hp = Math.min(p.maxhp, p.hp+30); G.texts.push({ x:p.x, y:p.y-20, s:"+30", life:.8, heal:true }); }
      else gainXp(g.v); }
  }
  G.gems = G.gems.filter(g => !g.got);
  if (G.gems.length > 400) G.gems.splice(0, G.gems.length-400);

  for (const f of G.fx) { f.life -= dt; if (f.vx) { f.x += f.vx*dt; f.y += f.vy*dt; } }
  G.fx = G.fx.filter(f => f.life > 0);
  for (const t of G.texts) { t.life -= dt; t.y -= 30*dt; }
  G.texts = G.texts.filter(t => t.life > 0);
  updateHud();
}
function gainXp(v) {
  const p = G.p; p.xp += v;
  if (p.xp >= p.next) { p.xp -= p.next; p.lv++; p.next = Math.round(5 + p.lv*4 + p.lv**1.5); openLevelUp(); }
}

// ===== レベルアップ =====
function openLevelUp() {
  const opts = [];
  for (const [k,w] of Object.entries(WEAPONS)) { const l = G.weapons[k]||0; if (l < w.max && (l>0 || Object.keys(G.weapons).length < 4)) opts.push({ k, w, l, type:"weapons" }); }
  for (const [k,w] of Object.entries(PASSIVES)) { const l = G.passives[k]||0; if (l < w.max) opts.push({ k, w, l, type:"passives" }); }
  if (!opts.length) { G.p.hp = Math.min(G.p.maxhp, G.p.hp+30); return; }
  opts.sort(() => Math.random()-.5);
  const box = $("choices"); box.innerHTML = "";
  opts.slice(0,3).forEach(o => {
    const b = document.createElement("button"); b.className = "choice";
    const lvTxt = o.l === 0 ? "NEW!" : `Lv${o.l} → ${o.l+1}`;
    b.innerHTML = `<span class="ic">${o.w.icon}</span><span><b>${o.w.name}</b> <span style="font-size:12px">${lvTxt}</span><small>${o.w.desc(o.l+1)}</small></span>`;
    b.onclick = () => {
      G[o.type][o.k] = o.l + 1;
      if (o.k === "hp") { G.p.maxhp += 20; G.p.hp = Math.min(G.p.maxhp, G.p.hp+40); }
      $("levelup").style.display = "none"; G.paused = false; last = performance.now();
    };
    box.appendChild(b);
  });
  G.paused = true; $("levelup").style.display = "flex";
}

// ===== 描画 =====
let shake = 0, bannerText = "", bannerT = 0;
function banner(t) { bannerText = t; bannerT = 2.2; }
function draw(dt) {
  const p = G.p;
  let sx = 0, sy = 0; if (shake > 0) { shake -= dt; sx = (Math.random()-.5)*8; sy = (Math.random()-.5)*8; }
  const cx = p.x - VW/2 + sx, cy = p.y - VH/2 + sy;
  // 地面
  ctx.fillStyle = "#1d3a2a"; ctx.fillRect(0,0,VW,VH);
  const T = 64, x0 = Math.floor(cx/T)*T, y0 = Math.floor(cy/T)*T;
  for (let y=y0; y<cy+VH+T; y+=T) for (let x=x0; x<cx+VW+T; x+=T) {
    const h = Math.abs((x*73856093) ^ (y*19349663)) % 100;
    ctx.fillStyle = ((x/T+y/T)&1) ? "#21422f" : "#1d3a2a"; ctx.fillRect(x-cx, y-cy, T, T);
    if (h < 12) { ctx.fillStyle = "#2f5e3e"; ctx.fillRect(x-cx+20, y-cy+30, 4, 8); ctx.fillRect(x-cx+26, y-cy+26, 4, 12); }
    else if (h < 15) { ctx.fillStyle = "#f2d96b"; ctx.beginPath(); ctx.arc(x-cx+40, y-cy+20, 3, 0, 7); ctx.fill(); }
  }
  ctx.save(); ctx.translate(-cx, -cy);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  // オーラ
  if (G.weapons.aura) { const R = 60 + G.weapons.aura*12;
    ctx.fillStyle = `rgba(255,230,120,${0.10+0.04*Math.sin(G.t*6)})`; ctx.beginPath(); ctx.arc(p.x,p.y,R,0,7); ctx.fill();
    ctx.strokeStyle = "rgba(255,230,120,.35)"; ctx.lineWidth = 2; ctx.stroke(); }
  // けいけんち
  for (const g of G.gems) {
    if (g.heal) { ctx.font = "16px serif"; ctx.fillText("🍖", g.x, g.y); continue; }
    ctx.fillStyle = g.v >= 4 ? "#ff6bd6" : g.v >= 2 ? "#6bffb0" : "#5aa8ff";
    ctx.beginPath(); ctx.moveTo(g.x, g.y-6); ctx.lineTo(g.x+5, g.y); ctx.lineTo(g.x, g.y+6); ctx.lineTo(g.x-5, g.y); ctx.fill();
  }
  // 敵
  for (const e of G.enemies) {
    ctx.font = `${e.r*2}px serif`;
    ctx.globalAlpha = e.hit > 0 ? 0.5 : 1;
    ctx.fillText(e.e, e.x, e.y + Math.sin(G.t*8 + e.x)*2);
    ctx.globalAlpha = 1;
    if (e.boss) { ctx.fillStyle = "#000"; ctx.fillRect(e.x-40, e.y-e.r-14, 80, 7); ctx.fillStyle = "#e85a5a"; ctx.fillRect(e.x-40, e.y-e.r-14, 80*e.hp/e.maxhp, 7); }
  }
  // 弾
  for (const s of G.shots) {
    if (s.enemy) { ctx.fillStyle = "#b04bff"; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill(); ctx.fillStyle = "#f0d0ff"; ctx.beginPath(); ctx.arc(s.x,s.y,s.r/2,0,7); ctx.fill(); continue; }
    drawStar(s.x, s.y, s.r, s.kind === "nova" ? "#ffb4f0" : "#ffe36b", G.t*10);
  }
  // つきのわ
  if (G.weapons.orbit) { const n = G.weapons.orbit+1, R = 70 + G.weapons.orbit*4; ctx.font = "22px serif";
    for (let i=0;i<n;i++) { const a = G.t*3.2 + i*Math.PI*2/n; ctx.fillText("🌙", p.x+Math.cos(a)*R, p.y+Math.sin(a)*R); } }
  // プレイヤー
  drawHero(p);
  // エフェクト
  for (const f of G.fx) {
    if (f.zap) { ctx.strokeStyle = `rgba(200,230,255,${f.life*4})`; ctx.lineWidth = 4; ctx.beginPath(); let yy = f.y-300; ctx.moveTo(f.x, yy);
      while (yy < f.y) { yy += 40; ctx.lineTo(f.x + (Math.random()-.5)*30, Math.min(yy, f.y)); } ctx.stroke();
      ctx.fillStyle = `rgba(255,255,200,${f.life*2})`; ctx.beginPath(); ctx.arc(f.x,f.y,50,0,7); ctx.fill(); }
    else { ctx.fillStyle = f.c; ctx.globalAlpha = f.life*2.5; ctx.fillRect(f.x-2, f.y-2, 4, 4); ctx.globalAlpha = 1; }
  }
  ctx.font = "bold 14px sans-serif";
  for (const t of G.texts) { ctx.globalAlpha = Math.min(1, t.life*3); ctx.fillStyle = "#000"; ctx.fillText(t.s, t.x+1, t.y+1); ctx.fillStyle = t.heal ? "#6bff8a" : "#fff"; ctx.fillText(t.s, t.x, t.y); }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (bannerT > 0) { bannerT -= dt; ctx.globalAlpha = Math.min(1, bannerT);
    ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center"; ctx.fillStyle = "#000"; ctx.fillText(bannerText, VW/2+2, VH*0.3+2);
    ctx.fillStyle = "#ffd34d"; ctx.fillText(bannerText, VW/2, VH*0.3); ctx.globalAlpha = 1; }
}
function drawStar(x, y, r, c, rot) {
  ctx.fillStyle = c; ctx.beginPath();
  for (let i=0;i<10;i++) { const a = rot + i*Math.PI/5, rr = i%2 ? r*0.45 : r; ctx.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr); }
  ctx.fill();
}
function drawHero(p) {
  const bob = p.moving ? Math.abs(Math.sin(G.t*12))*3 : 0, x = p.x, y = p.y - bob;
  if (p.inv > 0 && Math.floor(G.t*20)%2) return;
  ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(p.x, p.y+15, 12, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#3a2a8f"; ctx.beginPath(); ctx.moveTo(x-12, y+14); ctx.lineTo(x, y-4); ctx.lineTo(x+12, y+14); ctx.fill(); // マント
  ctx.fillStyle = "#2b4fd1"; ctx.fillRect(x-7, y-2, 14, 15);  // 体
  ctx.fillStyle = "#ffe0bd"; ctx.beginPath(); ctx.arc(x, y-9, 8, 0, 7); ctx.fill(); // 顔
  ctx.fillStyle = "#7a3b12"; ctx.beginPath(); ctx.arc(x, y-12, 8, Math.PI, 0); ctx.fill(); // 髪
  drawStar(x, y-20, 5, "#ffd34d", -Math.PI/2); // 星の飾り
  ctx.fillStyle = "#222"; ctx.fillRect(x+p.face*3-1, y-9, 2, 3); ctx.fillRect(x+p.face*3-5*Math.sign(p.face)-1, y-9, 2, 3);
  ctx.strokeStyle = "#ffd34d"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x+p.face*10, y+10); ctx.lineTo(x+p.face*10, y-6); ctx.stroke(); // つえ
  // HPバー
  ctx.fillStyle = "#000"; ctx.fillRect(p.x-18, p.y+22, 36, 5);
  ctx.fillStyle = p.hp/p.maxhp > .3 ? "#5fd36b" : "#e85a5a"; ctx.fillRect(p.x-18, p.y+22, 36*Math.max(0,p.hp)/p.maxhp, 5);
}
function updateHud() {
  $("xp").style.width = (G.p.xp/G.p.next*100) + "%";
  $("lv").textContent = `Lv ${G.p.lv}`;
  const s = Math.floor(G.t); $("time").textContent = `${s/60|0}:${String(s%60).padStart(2,"0")}`;
  $("kills").textContent = `💀 ${G.kills}`;
}

// ===== ゲームの流れ =====
function togglePause() {
  if (!G || G.over || !G.running || $("levelup").style.display === "flex") return;
  G.paused = !G.paused; $("pause").style.display = G.paused ? "flex" : "none";
  if (G.paused) $("pauseInfo").innerHTML = Object.entries({...G.weapons, ...G.passives}).map(([k,l]) => `${(WEAPONS[k]||PASSIVES[k]).icon} ${(WEAPONS[k]||PASSIVES[k]).name} Lv${l}`).join("<br>");
  last = performance.now();
}
function finish(title, text) { G.over = true; $("endTitle").textContent = title; $("endText").innerHTML = text; $("end").style.display = "flex"; }
function stats() { const s = Math.floor(G.t); return `生きのびた時間：${s/60|0}分${s%60}秒<br>たおした敵：${G.kills}<br>レベル：${G.p.lv}`; }
function gameOver() { finish("ちからつきた…", stats()); }
function victory() { finish("★ ゲームクリア！ ★", "やみのまどうし を たおし、星が夜空に もどった！<br><br>" + stats()); }

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if (G && G.running && !G.paused && !G.over) update(dt);
  if (G) draw(G.paused || G.over ? 0 : dt);
  requestAnimationFrame(frame);
}
$("startBtn").onclick = () => { $("title").style.display = "none"; newGame(); last = performance.now(); };
$("retryBtn").onclick = () => { $("end").style.display = "none"; newGame(); last = performance.now(); };
$("resumeBtn").onclick = togglePause;
$("pausebtn").onclick = togglePause;
newGame(); G.running = false; // タイトル画面の背景用
requestAnimationFrame(frame);
</script>
</body>
</html>
