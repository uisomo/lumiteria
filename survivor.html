const lvData = Object.assign({ xp:0 }, (() => { try { return JSON.parse(localStorage.getItem(LV_KEY)); } catch(e) { return null; } })() || {});
const lvOf = xp => Math.min(LV_MAX, 1 + Math.floor(Math.pow(Math.max(0, xp) / 5, 0.6)));
const xpFor = lv => lv <= 1 ? 0 : Math.ceil(5 * Math.pow(lv - 1, 1 / 0.6));
function addXP(n) { const fresh = (() => { try { return JSON.parse(localStorage.getItem(LV_KEY)); } catch(e) { return null; } })(); if (fresh && fresh.xp > lvData.xp) lvData.xp = fresh.xp;
  const before = lvOf(lvData.xp); lvData.xp += n; try { localStorage.setItem(LV_KEY, JSON.stringify(lvData)); } catch(e) {}
  const after = lvOf(lvData.xp); if (after > before) onLumiLevelUp(after); return after; }
function onLumiLevelUp(lv){
  const d=document.createElement('div');d.className='toast2 lvtoast';
  d.innerHTML=`⭐ ルミテリア レベル ${lv.toLocaleString()} に アップ！<div class="small" style="font-size:13px;color:#fff">🌈 ぜんぶの あそびで あがる レベルだよ</div>`;

}
/* ---------- coins / meta ---------- */
function loadMeta(){
  let m=null;try{m=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!m||typeof m!=='object')m={coins:605,up:{},gifts:[]};

  if(!Array.isArray(m.gifts))m.gifts=[];
  return m;
}
function saveCoins(add){
  const m=loadMeta();

function queryE(x,y,r){
  QR.length=0;qstamp++;r+=72;
  const x0=Math.floor((x-r)/GC),x1=Math.floor((x+r)/GC),y0=Math.floor((y-r)/GC),y1=Math.floor((y+r)/GC);

        if(a.hp<=0){a.hp=0;a.down=12;part(a.x,a.y,10,'#cccccc',120,.5,4);text(a.x,a.y-30,'たおれた…','#dddddd',13)}}}
    if(e.king){e.st-=dt;if(e.st<=0){e.st=6;for(let k=0;k<6&&E.length<MAXE+20;k++){const a=k*1.047;mk(e.ty==='zombie'?'zombie':'slime',e.x+Math.cos(a)*(e.r+20),e.y+Math.sin(a)*(e.r+20),{xp:1})}}}

  }
}
function update(dt){
  const g=G,p=g.p;
  g.T+=dt;g.frame++;
  // input
  let ix=0,iy=0;
  if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;
  if(keys.w||keys.arrowup)iy-=1;if(keys.s||keys.arrowdown)iy+=1;
  if(joy){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy);
    if(l>10){const f=Math.min(1,(l-10)/45);ix=dx/l*f;iy=dy/l*f}}
  const il=Math.hypot(ix,iy);
  if(il>1){ix/=il;iy/=il}
  // なめらかに うごく（きゅうに とまったり ふるえたり しない）
  const ak=1-Math.exp(-dt*16);p.vx+=(ix*p.spd-p.vx)*ak;p.vy+=(iy*p.spd-p.vy)*ak;
  if(il<.05&&Math.abs(p.vx)<2&&Math.abs(p.vy)<2){p.vx=0;p.vy=0}
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  p.moving=Math.hypot(p.vx,p.vy)>25;p.wp+=Math.hypot(p.vx,p.vy)*dt*.075;
  if(il>.05){const l=Math.hypot(ix,iy),fk=1-Math.exp(-dt*12);p.fx+=(ix/l-p.fx)*fk;p.fy+=(iy/l-p.fy)*fk;
    const fl=Math.hypot(p.fx,p.fy)||1;p.fx/=fl;p.fy/=fl}
  if(p.moving&&PT.length<480&&Math.random()<.15)PT.push({x:p.x,y:p.y+12,vx:rnd(-10,10),vy:rnd(-10,0),t:0,life:.3,s:3,c:'rgba(255,255,255,.6)',g:0});
  if(g.regen>0&&p.hp<p.mh)p.hp=Math.min(p.mh,p.hp+p.mh*g.regen/100*dt);
  p.inv=Math.max(0,p.inv-dt);
  // spawn
  g.sp-=dt;
  if(g.sp<=0){
    if(g.mode==='tut'){g.sp=1.1;if(g.tut.step>=2&&E.length<10)spawnRegular()}
    else{g.sp=Math.max(.09,1.05-g.T*.0016);const n=1+Math.floor(g.T/100);
      for(let i=0;i<n&&E.length<MAXE;i++)spawnRegular()}}

    banner('こうもりの むれが きた！','#ffb347')}
  buildGrid();
  updEnemies(dt);
  updAllies(dt);
  updSkills(dt*g.cdm);
  updProj(dt);
  updX(dt);
  updWorldFx(dt);
  updDrops(dt);
  updVisual(dt);
  let w=0;for(let i=0;i<E.length;i++)if(!E[i].dead)E[w++]=E[i];E.length=w;

function calc(){

/* パラメーター ひょうじ */
function paramsHTML(key){
  const s=charStats(key),rows=[['❤️ たいりょく',s.hp,100,''],['⚔️ こうげき',s.atk,100,'%'],['🛡️ まもり',s.def,40,'%'],['👟 はやさ',s.spd,40,'%'],['🍀 うん',s.luck,40,'%'],['💥 かいしん',s.crit,30,'%'],['⏩ スキルの はやさ',s.skill,50,'%']];
  let h='<div class="params">';
  for(const[n,v,mx,u]of rows)h+=`<span>${n}</span><i><b class="${v<0?'neg':''}" style="width:${Math.min(100,Math.abs(v)/mx*100)}%"></b></i><span>${sg(v)}${u}</span>`;
  if(key!=='me'){const A=ALLY[key],a=SV.allies[key],k=1+.15*(a.lv-1);h+=`<span>🤝 なかまの つよさ</span><i><b style="width:${a.lv*10}%"></b></i><span>HP ${Math.round(A.hp*k+s.hp)}・こうげき ${Math.round(A.dmg*k*(1+s.atk/100))}</span>`}
  return h+'</div>';
}

  h+='<h3>⚔️ ぶき（SSS → E）</h3>'+(SV.wpn.length?sortedW().map(x=>{const W=WPN_BY[x.id],hd=holder(x.u);

/* たからばこ */
function openChest(id){
  const c=CHESTS.find(x=>x.id===id);if(!c||SV.koban<c.cost)return null;
  SV.koban-=c.cost;let res=null;
  if(c.cos&&Math.random()<c.cos){const pool=['angel','dragon','hero'].filter(k=>!SV.cos.includes(k));if(pool.length){const k=pool[irnd(0,pool.length-1)];SV.cos.push(k);res={cos:k}}}
  if(!res){let tot=0;for(const k in c.w)tot+=c.w[k];let r=Math.random()*tot,rk='E';for(const k in c.w){if((r-=c.w[k])<0){rk=k;break}}
    const list=WPN.filter(w=>w.rk===rk),w=list[irnd(0,list.length-1)],n=SV.wpn.filter(x=>x.id===w.id).length;
    if(n>=WCOPY){saveCoins(RVAL[rk]);res={w,coin:RVAL[rk]}}else{SV.wpn.push({u:++SV.uid,id:w.id});res={w,n:n+1}}}
  addPXP(10);saveSV();return res;
}
function openChests(res){
  let h=`<h2>🧰 たからばこ</h2><div class="money"><span>💰 小判 ${SV.koban}まい</span></div><p class="small">小判は ゲームの なかで たまに ひろえるよ（1かいの プレイで さいだい 8まい）。<br>ぶきの ランク：SSS ＞ SS ＞ S ＞ A ＞ B ＞ C ＞ D ＞ E</p>`;
  if(res){
    if(res.cos){const C=COS[res.cos];h+=`<div class="row on" style="justify-content:center;flex-direction:column;text-align:center"><div class="reveal">${C.ico}</div><b>めずらしい コスチューム「${C.name}」！</b><div class="strong">💪 ${C.good}</div></div>`}
    else{const W=res.w;h+=`<div class="row on" style="justify-content:center;flex-direction:column;text-align:center"><div class="reveal">${W.ico}</div><b>${rkb(W.rk)}${W.name}</b><div class="ds">${wLine(W)}</div><div class="strong">💪 ${W.good}</div>${res.coin?`<div class="ds">もう ${WCOPY}こ もっているので 🪙 ${res.coin} コインに なった</div>`:res.n>1?`<div class="ds">${res.n}こめ（なかまにも もたせられるよ）</div>`:'<div class="ds">✨ あたらしい ぶき！</div>'}</div>`}
  }
  for(const c of CHESTS){const tot=Object.values(c.w).reduce((a,b)=>a+b,0);
    const odds=RANKS.filter(r=>c.w[r]).map(r=>`${rkb(r)}${Math.round(c.w[r]/tot*1000)/10}%`).join(' ');
    h+=`<div class="row"><div class="ic">${c.ico}</div><div class="gr"><b>${c.name}</b><div class="ds">${odds}${c.cos?'<br>＋ たまに めずらしい コスチューム':''}</div></div><button data-ch="${c.id}" ${SV.koban<c.cost?'disabled':''}>💰${c.cost} あける</button></div>`}
  h+=`<p class="small">ぶきの しゅるい：${WPN.length}こ　もっている：${new Set(SV.wpn.map(x=>x.id)).size}こ</p>`;
  menu(h+back());
  on('[data-ch]',d=>{const r=openChest(d.ch);if(r)openChests(r)});
}

    if(!a){h+=`<div class="row"><div class="ic">${A.ico}</div><div class="gr"><b>${A.job}の ${A.name}</b><div class="ds">HP ${A.hp}・こうげき ${A.dmg}</div><div class="strong">💪 ${A.good}</div></div><button data-hire="${id}" ${cn<A.cost?'disabled':''}>🪙${A.cost} やとう</button></div>`;continue}
    const inP=SV.party.includes(id),k=1+.15*(a.lv-1),cost=upCost(a.lv);

      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><button class="mini" data-up="${id}" ${a.lv>=ALLY_MAX||cn<cost?'disabled':''}>⬆️ つよくする 🪙${cost}</button><button class="mini sub" data-party="${id}">${inP?'✅ いっしょに いく':'るすばん'}</button><button class="mini sub" data-eqa="${id}">🎽 そうび</button></div></div></div>`}
  menu(h+back());
  on('[data-hire]',d=>{const A=ALLY[d.hire];if(loadMeta().coins<A.cost)return;saveCoins(-A.cost);SV.allies[d.hire]={lv:1};SV.eq[d.hire]={w:null,c:'normal'};
    if(SV.party.length<PARTY_MAX)SV.party.push(d.hire);addPXP(20);saveSV();toast2(`${A.ico} ${A.name}が なかまに なった！`);openAlly()});
  on('[data-up]',d=>{const a=SV.allies[d.up],c=upCost(a.lv);if(a.lv>=ALLY_MAX||loadMeta().coins<c)return;saveCoins(-c);a.lv++;addPXP(5);saveSV();openAlly()});
  on('[data-party]',d=>{const i=SV.party.indexOf(d.party);if(i>=0)SV.party.splice(i,1);else if(SV.party.length<PARTY_MAX)SV.party.push(d.party);else toast2(`いっしょに いけるのは ${PARTY_MAX}にん まで`);saveSV();openAlly()});
  on('[data-eqa]',d=>{eqTab=d.eqa;openEquip()});

function openLevelUp(){
  const g=G;st='levelup';
  const owned=Object.keys(g.sk);
  const pool=SKIDS.filter(id=>g.sk[id]?g.sk[id].lv<5:owned.length<6);
  const evo=Object.keys(SK).filter(id=>SK[id].evo&&!g.sk[id]&&SK[id].evo.every(x=>g.sk[x]&&g.sk[x].lv>=5)).slice(0,1);
  if(!pool.length&&!evo.length){g.pending=0;g.p.hp=Math.min(g.p.mh,g.p.hp+30);st='play';return}
  for(let i=pool.length-1;i>0;i--){const j=irnd(0,i);[pool[i],pool[j]]=[pool[j],pool[i]]}
  showCards(evo.length?'✨ しんか できるよ！ ✨':'レベルアップ！ Lv '+g.lv,evo.length?'2つの わざが 1つの さいきょうの わざに！':'スキルを 1つ えらんでね',evo.concat(pool).slice(0,3));
}
let curChoices=[];
function showCards(title,sub,list){
  curChoices=list;
  $('c-title').textContent=title;$('c-sub').textContent=sub;
  const box=$('c-list');box.innerHTML='';
  list.forEach((id,i)=>{
    const s=SK[id],cur=G.sk[id],nl=cur?cur.lv+1:1;
    const b=document.createElement('button');b.className='card';
    b.innerHTML=`<div class="ico">${s.ico}</div><div class="nm">${s.name}</div><div class="lv">${s.evo?'✨ しんか！ '+s.evo.map(x=>SK[x].ico).join('＋'):cur?'Lv '+cur.lv+' → Lv '+nl:'あたらしい！'}</div><div class="ds">${s.d[nl-1]}</div>`;
    b.addEventListener('click',()=>pick(id));
    box.appendChild(b);
  });
  show('o-cards');
}
function pick(id){
  if(st!=='levelup'||!curChoices.includes(id))return;
  curChoices=[];
  addSkill(id);

function drawHUD(){
  const g=G,p=g.p;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(g.fl>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(.5,g.fl*.6)+')';ctx.fillRect(0,0,W,H)}
  if(g.red>0){const gr=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.7);gr.addColorStop(0,'rgba(255,0,0,0)');gr.addColorStop(1,'rgba(255,40,40,'+g.red*1.4+')');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)}
  // xp
  bar(0,0,W,14,g.xp/g.need,'#5de0ff','rgba(0,0,0,.5)');
  stxt('Lv '+g.lv,8,7,11,'#fff');
  // hp
  bar(10,24,150,18,p.hp/p.mh,p.hp/p.mh>.3?'#ff6b8a':'#ff3b3b');
  stxt('❤ '+Math.ceil(p.hp)+' / '+p.mh,16,33,12,'#fff');
  // skills
  for(let i=0;i<6;i++){
    const x=10+i*37,y=48,id=Object.keys(g.sk)[i];
    ctx.fillStyle='rgba(22,20,34,.75)';ctx.beginPath();ctx.roundRect(x,y,34,34,8);ctx.fill();
    ctx.strokeStyle=id?'rgba(255,211,77,.8)':'rgba(255,255,255,.15)';ctx.lineWidth=2;ctx.stroke();
    if(id){ctx.font='19px '+FF;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(SK[id].ico,x+17,y+16);
      stxt(g.sk[id].lv>=5?'MAX':'Lv'+g.sk[id].lv,x+17,y+30,9,g.sk[id].lv>=5?'#ffd34d':'#fff','center')}
  }
  // time/coins
  if(g.mode==='tut')stxt('チュートリアル',W/2,34,20,'#7de3ff','center');
  else if(g.mode==='story')stxt('のこり '+fmt(Math.max(0,g.goal-g.T)),W/2,34,22,'#fff','center');
  else stxt(fmt(g.T),W/2,34,24,'#fff','center');
  const c=calc();
  stxt('🪙 '+c.total,W-62,38,18,'#ffd34d','right');
  stxt('たおした '+g.kills,W-62,58,13,'#fff','right');
  if(g.mode!=='tut')stxt('💰 '+g.koban+'/'+g.kobanCap,W-62,76,13,'#ffe27a','right');
  g.allies.forEach((a,i)=>{const x=10+i*56,y=88;ctx.fillStyle='rgba(22,20,34,.75)';ctx.beginPath();ctx.roundRect(x,y,52,24,8);ctx.fill();
    ctx.font='14px '+FF;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(a.down>0?'💤':ALLY[a.id].ico,x+4,y+12);
    bar(x+22,y+9,26,6,a.down>0?0:a.hp/a.mh,'#7de3ff')});
  if(g.tut&&g.tut.step<=5){const t=g.tut,msg=TUTTXT[t.step],bw=Math.min(W-20,520),bx=W/2-bw/2,by=H-150;
    ctx.font='bold 15px '+FF;const lines=[];let cur='';for(const ch of msg){if(ctx.measureText(cur+ch).width>bw-24){lines.push(cur);cur=ch}else cur+=ch}lines.push(cur);
    const bh=24+lines.length*22+(t.step===1||t.step===2?12:0);
    ctx.fillStyle='rgba(22,20,34,.88)';ctx.beginPath();ctx.roundRect(bx,by-bh,bw,bh,14);ctx.fill();ctx.strokeStyle='#ffd34d';ctx.lineWidth=2;ctx.stroke();
    stxt('👴 ステップ '+t.step+' / 5',bx+12,by-bh+12,12,'#ffd34d');
    lines.forEach((ln,i)=>stxt(ln,bx+12,by-bh+32+i*22,15,'#fff'));
    if(t.step===1)bar(bx+12,by-12,bw-24,7,t.dist/350,'#7dff9a');
    if(t.step===2)bar(bx+12,by-12,bw-24,7,(g.kills-t.k0)/5,'#7dff9a')}
  // boss bar
  let bs=null;for(const e of E)if(e.boss&&!e.dead){bs=e;break}
  if(bs){const bw=Math.min(300,W-40);bar(W/2-bw/2,56,bw,12,bs.hp/bs.mh,'#ff5a5a');stxt(bs.bname,W/2,78,13,'#ffb3b3','center')}
  // banner
  if(g.banner){const b=g.banner,a=Math.min(1,b.t*4,(3-b.t)*2);ctx.globalAlpha=Math.max(0,a);stxt(b.s,W/2,H*.28+(1-Math.min(1,b.t*5))*-20,clamp(W/16,18,30),b.col,'center');ctx.globalAlpha=1}
  // joystick
  if(joy){
    ctx.beginPath();ctx.arc(joy.ox,joy.oy,55,0,6.3);ctx.fillStyle='rgba(255,255,255,.1)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=3;ctx.stroke();
    const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy)||1,m=Math.min(l,55);
    ctx.beginPath();ctx.arc(joy.ox+dx/l*m,joy.oy+dy/l*m,24,0,6.3);ctx.fillStyle='rgba(255,211,77,.6)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.stroke();
  }
  // low hp warning
  if(p.hp/p.mh<.3&&st==='play'){ctx.globalAlpha=.2+.15*Math.sin(g.T*8);ctx.strokeStyle='#ff3b3b';ctx.lineWidth=10;ctx.strokeRect(0,0,W,H);ctx.globalAlpha=1}
}
function draw(){
  const g=G,p=g.p;
  const menuish=st==='title'||st==='menu';
  if(menuish){camX=p.x+Math.cos(camT*.3)*60;camY=p.y+Math.sin(camT*.2)*40}
  else{const k=1-Math.exp(-sdt*7);camX+=(p.x+p.vx*.22-camX)*k;camY+=(p.y+p.vy*.22-camY)*k}   // カメラは ほんの すこし おくれて ついてくる
  // ゆれは なめらかに（ガタガタ しないように）
  const sx=g.shake>0?Math.sin(g.T*61)*g.shake*.6:0,sy=g.shake>0?Math.cos(g.T*47)*g.shake*.6:0;
  const cx=camX+sx,cy=camY+sy;
  ctx.setTransform(dpr*Z,0,0,dpr*Z,Math.round(dpr*(W/2-cx*Z)),Math.round(dpr*(H/2-cy*Z)));
  ctx.fillStyle='#72c761';ctx.fillRect(cx-VW-10,cy-VH-10,VW*2+20,VH*2+20);
  drawGround();
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const d of D)if(Math.abs(d.x-cx)<VW+20&&Math.abs(d.y-cy)<VH+20)drawDrop(d);
  drawHoles();
  drawX(1);
  drawCorpses();
  drawFlameCone();
  const vis=[];for(const e of E){if(Math.abs(e.x-cx)<VW+80&&Math.abs(e.y-cy)<VH+80)vis.push(e)}
  vis.sort((a,b)=>a.y-b.y);
  let heroDone=false;
  for(const e of vis){if(!heroDone&&e.y>p.y){drawHero();heroDone=true}drawEnemy(e)}
  if(!heroDone)drawHero();
  if(!menuish){for(const a of g.allies)drawAlly(a);drawMirrors()}
  drawDusk();
  drawWhirls();
  drawPlates();
  for(const o of P)drawProj(o);
  drawX(0);
  drawParts();
  drawFlames();
  drawFx();
  // hp bars of enemies (bosses handled in HUD) ; small bars when damaged
  for(const e of vis){if(!e.boss&&e.hp<e.mh){const w=e.r*1.6;ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(e.x-w/2,e.y-e.r-9,w,4);ctx.fillStyle='#ff6b6b';ctx.fillRect(e.x-w/2,e.y-e.r-9,w*Math.max(0,e.hp/e.mh),4)}}
  // player hp bar
  if(!menuish){const w=44;ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(p.x-w/2-1,p.y+22,w+2,7);ctx.fillStyle=p.hp/p.mh>.3?'#6dff8a':'#ff5a5a';ctx.fillRect(p.x-w/2,p.y+23,w*p.hp/p.mh,5)}
  drawTexts();
  ctx.setTransform(dpr,0,0,dpr,0,0);drawVignette();
  if(!menuish)drawHUD();
}
/* ---------- loop ---------- */
let last=0,sdt=1/60;
function frame(ts){
  requestAnimationFrame(frame);
  let dt=(ts-last)/1000;last=ts;if(!(dt>0))dt=.016;dt=Math.min(dt,.05);
  sdt+=(dt-sdt)*.3;dt=sdt;   // フレームの ばらつきを ならして ブレを へらす
  if(st==='play')update(dt);
  else if(st==='dying'||st==='result'){updVisual(dt)}
  else if(st==='title'||st==='menu')camT+=dt;
  try{draw()}catch(err){console.error(err)}
}
requestAnimationFrame(frame);
showTitle();
window.__surv={get G(){return G},get st(){return st},get SV(){return SV},finish,startRun,pick,SK,E:()=>E,calc,loadMeta,update,openChest,WPN,COS,ALLY,STORY};
})();
</script>
