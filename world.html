<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>ルミテリア</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root { --line:#f4f1fb; --accent:#ffd34d; --panel:rgba(22,20,34,.88); --btn:#3a3358; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0b1230; color:var(--line); touch-action:none;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif; user-select:none; -webkit-user-select:none; }
  canvas { display:block; width:100vw; height:100vh; }
  [hidden] { display:none !important; }
  button { font:inherit; color:var(--line); background:var(--btn); border:2px solid #8a80b0; border-radius:10px; padding:8px 14px; cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; color:var(--line); border-color:#8a80b0; }
  button.big { font-size:18px; font-weight:bold; padding:12px 28px; border:3px solid var(--line); color:var(--accent); }
  kbd { display:inline-block; min-width:18px; padding:0 4px; margin-left:4px; border:1px solid #b9b0d8; border-radius:5px; font-size:11px; line-height:16px; text-align:center; background:#1b1830; color:var(--accent); font-family:inherit; }
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(5,8,25,.55); overflow:auto; }
  .card { background:var(--panel); border:3px solid var(--line); border-radius:16px; padding:20px; width:100%; max-width:580px; max-height:100%; overflow:auto; }
  .card h1 { margin:0 0 4px; text-align:center; color:var(--accent); letter-spacing:.08em; font-size:28px; }
  .card h2 { margin:0 0 10px; color:var(--accent); font-size:20px; }
  .card h3 { margin:16px 0 8px; font-size:15px; opacity:.9; }
  .sub { text-align:center; opacity:.85; margin:0 0 16px; font-size:14px; }
  .note { font-size:13px; opacity:.8; margin:4px 0; }
  .slot { display:flex; align-items:center; gap:10px; background:#2a2440; border:2px solid #6a5f8f; border-radius:12px; padding:12px; margin:10px 0; }
  .slot .grow { flex:1; min-width:0; } .slot small { opacity:.8; display:block; margin-top:3px; } .slot button { white-space:nowrap; }
  .slot.empty { border-style:dashed; opacity:.9; }
  .opts { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; }
  .opt { text-align:left; padding:10px; border-radius:12px; background:#2a2440; border:2px solid #6a5f8f; }
  .opt .ic { font-size:28px; display:block; } .opt b { display:block; margin:2px 0; } .opt small { opacity:.8; font-size:11px; line-height:1.4; display:block; }
  .opt.sel { border-color:var(--accent); background:#433a66; color:var(--line); box-shadow:0 0 0 2px var(--accent) inset; }
  input[type=text] { font:inherit; font-size:18px; width:100%; padding:10px; border-radius:10px; border:2px solid #8a80b0; background:#14121f; color:var(--line); }
  .row { display:flex; gap:8px; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid #3c3558; }
  .row .ic { font-size:26px; width:36px; text-align:center; } .row .grow { flex:1; min-width:0; } .row small { display:block; opacity:.75; font-size:12px; }
  .row.lock { opacity:.62; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; margin-left:6px; border-radius:8px; background:#5a4a3a; vertical-align:middle; }
  .tag.fold { background:#2f6f5f; }
  .cost { font-size:12px; opacity:.9; } .cost .no { color:#ff8080; }
  .inv { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:6px; }
  .it { background:#2a2440; border:2px solid #6a5f8f; border-radius:10px; padding:8px 6px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .it .ic { font-size:26px; } .it b { font-size:13px; } .it .n { color:var(--accent); font-weight:bold; } .it small { font-size:10px; opacity:.8; line-height:1.3; }
  .it button { padding:3px 10px; font-size:12px; margin-top:2px; }
  .stat { background:#2a2440; border-radius:10px; padding:8px 12px; font-size:14px; }
  /* HUD */
  #hud { position:fixed; inset:0; pointer-events:none; }
  #info { position:absolute; left:12px; top:12px; padding:10px 14px; background:var(--panel); border-radius:12px; border:2px solid #6a5f8f; min-width:210px; }
  #who { font-weight:bold; } #when { font-size:13px; opacity:.9; margin:2px 0 4px; }
  .bar { display:flex; align-items:center; gap:6px; margin-top:4px; font-size:12px; }
  .hpbar { flex:1; height:10px; background:#3a1c26; border-radius:6px; overflow:hidden; } .hpbar i { display:block; height:100%; background:linear-gradient(90deg,#ff6b6b,#ff9f6b); width:100%; transition:width .2s; }
  #hg { background:#7bd36b; }
  #fr { font-size:12px; opacity:.9; margin-top:5px; }
  #coinv { font-size:13px; font-weight:bold; color:#ffd34d; margin-top:3px; }
  /* ====== タイトル（ルミテリア） ====== */
  .overlay.titlebg { background:
      radial-gradient(circle at 18% 14%, rgba(255,60,110,.38), transparent 40%),
      radial-gradient(circle at 86% 22%, rgba(60,140,255,.38), transparent 42%),
      radial-gradient(circle at 52% 96%, rgba(255,200,40,.30), transparent 46%),
      radial-gradient(circle at 8% 86%, rgba(60,220,120,.28), transparent 40%),
      radial-gradient(circle at 92% 88%, rgba(170,100,255,.32), transparent 40%), #07051a; }
  .sparkle { position:fixed; width:6px; height:6px; border-radius:50%; background:#fff; box-shadow:0 0 10px 3px var(--c); animation:twinkle var(--d) ease-in-out infinite; animation-delay:var(--dl); pointer-events:none; }
  @keyframes twinkle { 0%,100% { opacity:.12; transform:scale(.5); } 50% { opacity:1; transform:scale(1.4); } }
  .titlewrap { position:relative; width:100%; max-width:920px; text-align:center; padding:64px 8px 8px; }
  .coins { position:absolute; right:10px; top:6px; display:flex; align-items:center; gap:10px; font-size:34px; font-weight:900; color:#ff5b6b; text-shadow:0 0 14px rgba(255,80,100,.8); }
  .coins.inl { position:static; justify-content:flex-end; font-size:24px; margin-top:-34px; }
  .coin { width:44px; height:44px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fffbd0, #ffd21f 45%, #d99400); display:grid; place-items:center; font-size:24px; color:#7a4c00; text-shadow:none;
    box-shadow:0 0 18px rgba(255,210,40,.9), inset 0 -4px 0 rgba(0,0,0,.2); animation:coinspin 3s ease-in-out infinite; }
  @keyframes coinspin { 0%,70%,100% { transform:rotateY(0); } 85% { transform:rotateY(180deg); } }
  .logo, .subt, .tbtn, .coins { font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif; }
  .logo { margin:0; font-size:clamp(64px, 16vw, 170px); line-height:1.1; white-space:nowrap; }
  .logo span { display:inline-block; font-weight:900; padding:0 .02em;
    background:linear-gradient(180deg, #fff 0%, var(--c) 32%, var(--c2) 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 16px var(--c)) drop-shadow(0 6px 0 var(--c2)); transform:rotate(var(--r)); animation:bob 2.6s ease-in-out infinite; animation-delay:var(--dl); }
  @keyframes bob { 0%,100% { transform:rotate(var(--r)) translateY(0); } 50% { transform:rotate(calc(var(--r) * -1)) translateY(-12px); } }
  .subt { font-size:clamp(22px,4.8vw,42px); font-weight:900; color:#ff6f8e; text-shadow:0 0 16px rgba(255,90,130,.9), 0 3px 0 #b0103a; margin:4px 0 34px; letter-spacing:.06em; }
  .tbtns { display:grid; grid-template-columns:1fr 1.8fr 1fr; gap:16px; align-items:stretch; }
  .tbtn { position:relative; overflow:hidden; border:4px solid rgba(255,255,255,.92); border-radius:24px; font-size:clamp(18px,3.4vw,30px); font-weight:900; color:#fff; padding:20px 8px;
    text-shadow:0 2px 0 rgba(0,0,0,.35); background:linear-gradient(180deg,var(--a),var(--b));
    box-shadow:0 0 26px var(--g), inset 0 -7px 0 rgba(0,0,0,.25), inset 0 7px 0 rgba(255,255,255,.35); transition:transform .15s; }
  .tbtn:hover { transform:translateY(-3px) scale(1.04); color:#fff; border-color:#fff; }
  .tbtn:disabled { opacity:.45; color:#fff; border-color:rgba(255,255,255,.6); transform:none; }
  .tbtn::after { content:""; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent); animation:shine 3.2s infinite; }
  @keyframes shine { 0% { left:-60%; } 40%,100% { left:130%; } }
  .tbtn.gacha { --a:#52b0ff; --b:#1450d8; --g:rgba(60,140,255,.85); }
  .tbtn.start { --a:#ff6060; --b:#d00c2c; --g:rgba(255,60,80,.95); font-size:clamp(28px,5.2vw,50px); animation:pulse 1.6s ease-in-out infinite; }
  .tbtn.up    { --a:#b088ff; --b:#5a26d4; --g:rgba(150,100,255,.85); }
  @keyframes pulse { 0%,100% { box-shadow:0 0 22px var(--g), inset 0 -7px 0 rgba(0,0,0,.25), inset 0 7px 0 rgba(255,255,255,.35); } 50% { box-shadow:0 0 46px var(--g), inset 0 -7px 0 rgba(0,0,0,.25), inset 0 7px 0 rgba(255,255,255,.35); } }
  .tbtn small { display:block; font-size:13px; opacity:.95; margin-top:2px; }
  @media (max-width:560px) { .tbtns { grid-template-columns:1fr 1fr; } .tbtn.start { grid-column:1 / -1; order:-1; } .coins { font-size:24px; } .coin { width:34px; height:34px; font-size:18px; } }
  /* ガチャ */
  .gres { text-align:center; margin:14px auto; padding:18px; border-radius:20px; border:4px solid #777; max-width:300px; background:#1c1838; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .gres .gic { font-size:76px; line-height:1.1; }
  .gres b { font-size:20px; }
  .gres.spin .gic { animation:shake .12s linear infinite; }
  .gres.pop { animation:pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes shake { 0%,100% { transform:rotate(-12deg); } 50% { transform:rotate(12deg); } }
  @keyframes pop { from { transform:scale(.3); opacity:0; } }
  .gres.r-R { border-color:#3d8bff; box-shadow:0 0 24px rgba(60,140,255,.7); }
  .gres.r-SR { border-color:#a46bff; box-shadow:0 0 30px rgba(170,100,255,.85); }
  .gres.r-SSR { border-color:#ffd34d; box-shadow:0 0 40px rgba(255,210,60,.95); background:linear-gradient(135deg,#3a1030,#1c1850,#103a30); }
  .rar { display:inline-block; font-weight:900; padding:2px 12px; border-radius:10px; background:#777; color:#fff; }
  .rar.r-R { background:#2f7cf0; } .rar.r-SR { background:#8a4cf0; } .rar.r-SSR { background:linear-gradient(90deg,#ff4d6d,#ffb02e,#46e06a,#4aa3ff); }
  .rar.r-N { background:#6b6b7b; }
  .rar.r-UR { background:linear-gradient(90deg,#ffd34d,#ff8a3d,#ff4d8a); color:#2a1400; }
  .gres.r-N { border-color:#9a9ab0; }
  .gres.r-UR { border-color:#ff8a3d; box-shadow:0 0 40px rgba(255,140,60,.95); background:linear-gradient(135deg,#3a1a10,#2a1040); }
  .gres .treas { font-size:14px; color:#ffd34d; font-weight:bold; }
  .rar.sm { font-size:10px; padding:0 5px; margin:0 6px 0 1px; }
  .lv { color:#ffd34d; letter-spacing:2px; }
  #hint { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); background:var(--panel); padding:6px 14px; border-radius:20px; font-size:14px; white-space:nowrap; max-width:calc(100vw - 24px); overflow:hidden; text-overflow:ellipsis; }
  #toasts { position:absolute; left:50%; top:28%; transform:translateX(-50%); width:max-content; max-width:calc(100vw - 32px); display:flex; flex-direction:column; gap:6px; align-items:center; }
  .toast { background:var(--panel); border:2px solid var(--accent); padding:8px 16px; border-radius:20px; font-size:15px; animation:tin .3s; text-align:center; }
  @keyframes tin { from { opacity:0; transform:translateY(-10px); } }
  #hurt { position:absolute; inset:0; box-shadow:inset 0 0 120px rgba(255,0,0,.7); opacity:0; transition:opacity .3s; }
  #topbtns { position:absolute; right:12px; top:12px; display:flex; flex-direction:column; align-items:flex-end; gap:6px; pointer-events:auto; }
  #help { position:absolute; left:12px; bottom:12px; font-size:12px; line-height:1.6; background:var(--panel); padding:8px 12px; border-radius:10px; opacity:.88; }
  #help b { color:var(--accent); }
  @media (max-width:1100px) { #help { display:none; } }
  @media (max-width:520px) { #info { min-width:0; max-width:56vw; font-size:13px; } #topbtns button { padding:6px 10px; font-size:13px; } }
  /* タッチ操作 */
  #touch { position:fixed; inset:0; pointer-events:none; }
  #stickZone { position:absolute; left:0; bottom:0; width:45%; height:50%; pointer-events:auto; }
  #stick { position:absolute; width:120px; height:120px; margin:-60px; border-radius:50%; border:3px solid rgba(255,255,255,.4); display:none; }
  #stick i { position:absolute; left:35px; top:35px; width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,.45); }
  #tbtns { position:absolute; right:12px; bottom:64px; display:grid; grid-template-columns:repeat(3,62px); gap:8px; pointer-events:auto; }
  #tbtns button { height:62px; padding:0; font-size:22px; border-radius:50%; background:rgba(40,34,64,.8); }
  #tbtns button small { display:block; font-size:10px; }
  @media (pointer:coarse) { #help { display:none; } kbd { display:none; } #hint { bottom:220px; } }
</style>

// ====== 乱数とノイズ ======
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let perm;
function initNoise(seed) { const r = rng(seed); const p = [...Array(256).keys()]; for (let i=255;i>0;i--) { const j = r()*(i+1)|0; [p[i],p[j]] = [p[j],p[i]]; } perm = new Uint8Array(512); for (let i=0;i<512;i++) perm[i] = p[i&255]; }
function hash(x,z) { return perm[(perm[x & 255] + (z & 255)) & 511] / 255; }
function vnoise(x,z) { const xi = Math.floor(x), zi = Math.floor(z), xf = x-xi, zf = z-zi, u = xf*xf*(3-2*xf), v = zf*zf*(3-2*zf);
  const a = hash(xi,zi), b = hash(xi+1,zi), c = hash(xi,zi+1), d = hash(xi+1,zi+1); return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v; }
function fbm(x,z,oct=4) { let s=0, amp=1, f=1, t=0; for (let i=0;i<oct;i++) { s += vnoise(x*f + i*31.7, z*f + i*17.3)*amp; t += amp; amp *= .5; f *= 2; } return s/t; }

function baseH(x,z) {
  let h = 2.5 + (fbm(x*.012, z*.012) - .5) * 11;
  h += smooth(-70,-210,z) * (6 + fbm(x*.025+50, z*.025, 5) * 46);   // 北の山
  h += smooth(110,220,x) * (3 + fbm(x*.03, z*.03+80) * 10);          // 東の雪の丘
  h -= smooth(120,215,z) * 16;                                       // 南の海
  h -= smooth(240,295,Math.hypot(x,z)) * 25;                         // 世界のはしは海
  return h;
}

const COL = { sand:[.87,.8,.56], grass:[.42,.7,.3], forest:[.25,.52,.22], rock:[.53,.51,.5], snow:[.95,.97,1], dirt:[.5,.35,.2], wet:[.6,.56,.42] };
function terrainColor(x,z,h,dug) {
  const v = .88 + fbm(x*.15, z*.15, 2) * .24;
  let c;
  if (dug) c = COL.dirt;
  else if (h < -.4) c = COL.wet;
  else if (h < .9) c = COL.sand;
  else if (x > 125 + (fbm(x*.02, z*.02, 2)-.5)*40 || h > 30) return COL.snow;
  else if (h > 17) c = COL.rock;
  else if (x < -45 + (fbm(x*.03+9, z*.03, 2)-.5)*30) c = COL.forest;
  else c = COL.grass;
  return [c[0]*v, c[1]*v, c[2]*v];
}
function buildTerrain() {
  const pos = new Float32Array(NV*NV*3), col = new Float32Array(NV*NV*3);
  for (let iz=0; iz<NV; iz++) for (let ix=0; ix<NV; ix++) {
    const i = iz*NV+ix, x = -HALF + ix*STEP, z = -HALF + iz*STEP;
    const d = S.digs[i] || 0, h = baseH(x,z) + d; hs[i] = h;
    pos[i*3] = x; pos[i*3+1] = h; pos[i*3+2] = z;
    const c = terrainColor(x,z,h, d !== 0); col.set(c, i*3);
  }
  const idx = new Uint32Array(SEG*SEG*6); let k = 0;
  for (let iz=0; iz<SEG; iz++) for (let ix=0; ix<SEG; ix++) { const a = iz*NV+ix, b = a+1, c = a+NV, d = c+1; idx.set([a,c,b, b,c,d], k); k += 6; }
  terrainGeo = new THREE.BufferGeometry();
  terrainGeo.setAttribute("position", new THREE.BufferAttribute(pos,3));
  terrainGeo.setAttribute("color", new THREE.BufferAttribute(col,3));
  terrainGeo.setIndex(new THREE.BufferAttribute(idx,1));
  terrainGeo.computeVertexNormals();
  const m = new THREE.Mesh(terrainGeo, new THREE.MeshLambertMaterial({ vertexColors:true })); m.receiveShadow = true; scene.add(m);
  const water = new THREE.Mesh(new THREE.PlaneGeometry(2000,2000), new THREE.MeshLambertMaterial({ color:0x3a8fd8, transparent:true, opacity:.78 }));

function groundAt(x,z) {

// ====== アクション ======
let target = null, buildMode = null, buildRot = 0, ghost = null, ghostType = null;
function camForward() { return [-Math.sin(yaw), -Math.cos(yaw)]; }
function findTarget() {
  let best = null, bd = 1e9;
  for (const e of enemies) { const d = Math.hypot(e.x-P.x, e.z-P.z); if (d < 2.8 && d < bd) { bd = d; best = { type:"enemy", e }; } }
  if (best) return best;
  if (mom && mom.g.visible && Math.hypot(MOM.x-P.x, MOM.z-P.z) < 2.6) return { type:"parent" };
  { let vb = null, vd = 2.6; for (const v of vils) { const d = Math.hypot(v.B.x-P.x, v.B.z-P.z); if (d < vd) { vd = d; vb = v; } } if (vb) return { type:"villager", v:vb }; }
  nearObjs(P.x, P.z, o => { const d = Math.hypot(o.x-P.x, o.z-P.z) - o.r; if (d < 1.4 && d < bd) { bd = d; best = { type:"obj", o }; } });

  const o = t.o;
  if (o.kind === "ore" && !S.tools.pick) return toast("⛏️ つるはしが ないと てつは ほれないよ（クラフトで つくろう）");
  let power = 1;
  if ((o.kind === "tree" || o.kind === "pine") && S.tools.axe) power++;
  if ((o.kind === "tree" || o.kind === "pine") && S.job === "kikori") power++;
  if ((o.kind === "rock" || o.kind === "ore") && S.tools.pick) power++;

// 木や石を たたく（こわれたら true）
function hitObj(o, power, byFriend) {
  const y = groundAt(o.x,o.z);
  o.hp -= power;
  const color = { tree:0x7a5230, pine:0x7a5230, rock:0x888888, ore:0xb87545, bush:0x3f7d32 }[o.kind];
  bits(o.x, y+1, o.z, color, 5);

  o.gone = true; placeObj(o); S.removed.push(o.id); bits(o.x, y+1.5, o.z, color, 14); addCoins(Math.round(2*coinRate()));
  const pre = byFriend ? `🤝 ${esc(S.friendName)}：` : "";

  if (o.kind === "tree" || o.kind === "pine") gain("wood", 3 + bonus("kikori") + scarce("wood"), pre);
  if (o.kind === "rock") gain("stone", 3 + bonus("koufu") + scarce("stone"), pre);

// ====== たてるモード ======
function setBuild(type) {

  if (ghost) { scene.remove(ghost); ghost = null; ghostType = null; }
  if (type && type !== "remove" && type !== "fold") { ghost = makeBuild(type); ghost.traverse(m => { if (m.isLight) m.intensity = 0; }); scene.add(ghost); ghostType = null; }
}
function rotateBuild() { if (buildMode) buildRot = (buildRot+1) % 4; }
function buildSpot() { const [fx,fz] = camForward(), d = BUILDS[buildMode].dist || 4.5;
  let x = P.x + fx*d, z = P.z + fz*d; if (buildMode !== "raise") { x = Math.round(x/2)*2; z = Math.round(z/2)*2; } return [x,z]; }

    scene.remove(b.group); S.builds.splice(S.builds.indexOf(b),1); rebuildColliders();
    if (isFold(b) || BUILDS[b.type].furn) { if (isFold(b)) cnt("fold"); S.inv[b.type] = (S.inv[b.type]||0) + 1; bits(b.x, groundAt(b.x,b.z)+1, b.z, 0x6fb7c9, 16); toast(`📦 ${BUILDS[b.type].name} を たたんで もちものに しまった`); return; }
    const c = { ...BUILDS[b.type].cost }; if (S.job === "daiku" && !BUILDS[b.type].fixed) for (const k in c) c[k] = Math.ceil(c[k]/2);
    for (const [k,v] of Object.entries(c)) if (k !== "soil") S.inv[k] = (S.inv[k]||0) + (BUILDS[b.type].fixed ? v : Math.floor(v/2));

  bits(x, groundAt(x,z)+1, z, 0xffffff, 10);
  if (BUILDS[buildMode].kind === "house") toast(`${BUILDS[buildMode].icon} ${BUILDS[buildMode].name} が できた！${BUILDS[buildMode].fold ? "（6 → 📦たたむ で しまえる）" : ""}`);
  if (!canPay(costOf(buildMode))) { if (BUILDS[buildMode].kind !== "house") toast(`${BUILDS[buildMode].name} の ざいりょうが なくなった`); setBuild(null); }
}

function updateInside(dt) {

function pushOut(x, z, r, y, h, stand) {
  let top = -Infinity;

    if (d2 >= r*r || y + h < c.minY) continue;
    if (stand && y >= c.maxY - .45) { top = Math.max(top, c.maxY); continue; }
    if (d2 > 1e-6) { const d = Math.sqrt(d2); x = cx + dx/d*r; z = cz + dz/d*r; }
    else { const o = [[c.minX-r-x,0],[c.maxX+r-x,0],[0,c.minZ-r-z],[0,c.maxZ+r-z]].sort((a,b) => Math.abs(a[0]+a[1]) - Math.abs(b[0]+b[1]))[0]; x += o[0]; z += o[1]; }

  if (hd > (S.hw||0)) { S.hw = hd; if (hd >= 5 && hd < STARVE_DAYS) toast(`🍙 おなかが すいた… あと ${STARVE_DAYS-hd}日 たべないと たおれちゃう！<br>おうちで おかあさんに ごはんを もらおう`); }

  const mx = fx*iz + rx*ix, mz = fz*iz + rz*ix;
  const speed = (4 + sc*2.2) * (1 + meta.up.spd*.08) * (keys.ShiftLeft || (!manualF && keys.ShiftRight) ? 1.6 : 1);

  // カメラ（2人の ときは まんなかを うつす）

  if (manualF) { const d = Math.hypot(F.x-P.x, F.z-P.z); tgt.set((P.x+F.x)/2, (P.y+F.y)/2 + 1.4*sc, (P.z+F.z)/2); extra = Math.min(d*.6, 14); }

      <p class="note">🎂 5さいから はじまって、1日 すぎるごとに 1さい 大きくなるよ<br>🍱 ${STARVE_DAYS}日間 ごはんを たべないと たおれちゃう。おかあさんが まいにち ごはんを つくってくれるよ</p>

    screen.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { st[b.dataset.g] = b.dataset.k; render(); });
    screen.querySelectorAll("[data-en]").forEach(b => b.onclick = () => { st.enemies = b.dataset.en === "1"; render(); });
    screen.querySelector("#cancel").onclick = showSlots;
    screen.querySelector("#go").onclick = () => {
      const n = screen.querySelector("#nm").value.trim() || "ぼうけんしゃ", fn = screen.querySelector("#fnm").value.trim() || "ともだち";
      screen.innerHTML = `<div class="card"><h2>せかいを つくっています…</h2></div>`;
      setTimeout(() => createWorld(slot, n, fn, st.job, st.home, st.enemies), 50); };
  };
  render();
}
window.__dbg = { get S() { return S; }, P, F, MOM, objs, enemies, animals, get colliders() { return colliders; }, setYaw: v => yaw = v };
showTitle();
</script>
